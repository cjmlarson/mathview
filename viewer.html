<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude MathView</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 46rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
    line-height: 1.55;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #d4d4d4; }
    a { color: #6cb6ff; }
    code, pre { background: #2a2a2a; }
  }
  code, pre { background: #f2f2f2; border-radius: 4px; }
  code { padding: 0.1em 0.3em; }
  pre { padding: 0.75em; overflow-x: auto; }
  pre code { padding: 0; background: none; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.2em 0; }
  #meta { font-size: 0.75rem; opacity: 0.55; margin-bottom: 1rem; }
</style>
</head>
<body>
<div id="meta">connecting…</div>
<div id="out"></div>
<script>
let last = null;

function render(md) {
  const stash = [];
  const shielded = md.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+\$/g, m => {
    stash.push(m);
    return ` ${stash.length - 1} `;
  });
  let html = marked.parse(shielded);
  html = html.replace(/ (\d+) /g, (_, i) => stash[+i]
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"));
  const out = document.getElementById("out");
  out.innerHTML = html;
  renderMathInElement(out, {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "$", right: "$", display: false },
    ],
    throwOnError: false,
  });
}

async function poll() {
  try {
    const res = await fetch("latest.md", { cache: "no-store" });
    if (res.ok) {
      const md = await res.text();
      if (md !== last) {
        last = md;
        render(md);
        document.getElementById("meta").textContent =
          "updated " + new Date().toLocaleTimeString();
      }
    }
  } catch (e) {
    document.getElementById("meta").textContent = "server unreachable — is serve.sh running?";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  poll();
  setInterval(poll, 1000);
});
</script>
</body>
</html>
